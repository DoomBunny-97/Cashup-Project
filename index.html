<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- <span id="testSpan">tt</span> -->

    <div class="container">
      <div class="title-button">
        <h1>Cash Up</h1>
        <input
          type="number"
          name="compTot"
          id="compTot"
          placeholder="Computer Total"
        />
        <button>Clear</button>
      </div>
      <div class="line"></div>
      <div class="wrapper">
        <span class="value">0.1</span>
        <p>10c x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)"/> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">0.2</span>
        <p>20c x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">0.5</span>
        <p>50c x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">1</span>
        <p>R1 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">2</span>
        <p>R2 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">5</span>
        <p>R5 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">10</span>
        <p>R10 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">20</span>
        <p>R20 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">50</span>
        <p>R50 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">100</span>
        <p>R100 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="wrapper">
        <span class="value">200</span>
        <p>R200 x</p><input type="number" placeholder="0" 
        oninput="preventOverflow(this)" /> = R
        <span class="small-total">0.00</span>
      </div>
      <div class="totals-div wrapper">
        <p>Total = R<span class="total">0.00</span></p>
        <p>Excl. Float = R<span class="excl-float">0.00</span></p>
      </div>
      <div id="diff" class="wrapper"><p>Difference = R<span>0.00</span></p></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
